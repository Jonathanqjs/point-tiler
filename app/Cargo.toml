[package]
name = "app"
version.workspace = true
authors.workspace = true
edition.workspace = true

[lib]
name = "point_tiler"
path = "src/lib.rs"

[[bin]]
name = "ptiler"
path = "src/main.rs"

[dependencies]
pcd-parser = { path = "../pcd-parser" }
cesiumtiles-gltf = { path = "../cesiumtiles-gltf" }
cesiumtiles-gltf-json = { path = "../cesiumtiles-gltf/cesiumtiles-gltf-json" }
pcd-exporter = { path = "../pcd-exporter" }
pcd-core = { path = "../pcd-core" }
coordinate-transformer = { path = "../coordinate-transformer", features = ["bundled-proj"] }
cesiumtiles = "0.0.1"
rayon = "1.11.0"
clap = { version = "4.5.20", features = ["derive", "string"] }
thiserror = "2.0.18"
chrono = "0.4.38"
log = "0.4.22"
env_logger = "0.11.5"
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
glob = "0.3.1"
tempfile = "3.14.0"
bitcode = "0.6.3"
bytemuck = "1.20.0"
tinymvt = "0.3.0"
flate2 = "1"
crossbeam = "0.8.4"
num_cpus = "1.16"
